version: '3.8'

services:
  harvestsaarthi-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: harvestsaarthi-ai:latest
    container_name: harvestsaarthi_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
